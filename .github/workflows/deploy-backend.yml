name: Deploy Backend to AWS

on:
  push:
    branches: [deploy]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: casino-backend 
  IMAGE_TAG_VERSION: v1.0.0

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
    #Configrar credenciales AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
    
    #Login a Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr 
        uses: aws-actions/amazon-ecr-login@v2

    #Build de imagen Docker
      - name: Build Docker image 
        env: 
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_VERSION \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .

    #Push a ECR
      - name: Push a ECR 
        env: 
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_VERSION 
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest 
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
    
    #Deploy a EC2
      - name: Deploy to EC2 backend
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          proxy_host: ${{ secrets.EC2_FRONTEND_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}

          envs: ECR_REGISTRY,ECR_REPOSITORY,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          script: |
            if ! command -v docker >/dev/null 2>&1; then
              sudo dnf update -y
              sudo dnf install -y docker
              sudo systemctl enable --now docker
            fi

            sudo systemctl start docker

            aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY

            sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

            sudo docker network create casino-net || true
            sudo docker volume create casino_pg_data || true

            sudo docker stop casino-db || true
            sudo docker rm casino-db || true

            sudo docker run -d \
              --name casino-db \
              --restart unless-stopped \
              --network casino-net \
              -e POSTGRES_DB="${{ secrets.DB_NAME }}" \
              -e POSTGRES_USER="${{ secrets.DB_USER }}" \
              -e POSTGRES_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -v casino_pg_data:/var/lib/postgresql/data \
              postgres:16-alpine

            echo "Esperando PostgreSQL..."
            for i in {1..30}; do
              if sudo docker exec casino-db pg_isready -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}"; then
                break
              fi
              sleep 2
            done

            echo "Inicializando esquema de base de datos..."
            sudo docker run --rm \
              --network casino-net \
              $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
              sh -c 'cat /app/db/init.sql' \
              | sudo docker exec -i casino-db psql \
                  -U "${{ secrets.DB_USER }}" \
                  -d "${{ secrets.DB_NAME }}"

            sudo docker stop casino-backend || true
            sudo docker rm casino-backend || true

            sudo docker run -d \
              --name casino-backend \
              --restart unless-stopped \
              --network casino-net \
              -p 3000:3000 \
              -e PORT=3000 \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_EXPIRES_IN=8h \
              -e DB_HOST=casino-db \
              -e DB_PORT=5432 \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e CORS_ORIGIN="${{ secrets.CORS_ORIGIN }}" \
              $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

            sudo docker ps