services:
  db:
    image: postgres:16-alpine
    container_name: casino-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-casino_db}
      POSTGRES_USER: ${DB_USER:-casino}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-casino}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - casino-net 
  
  backend:
    build:
      context: .
      dockerfile: Dockerfile 
    image: casino-backend:local
    restart: unless-stopped
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-esta_variable_se_debe_cambiar_en_produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-casino}
      DB_PASSWORD: ${DB_PASSWORD:-casino}
      DB_NAME: ${DB_NAME:-casino_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - casino-net
  
  frontend:
    build:
      context: ../frontend_intro_devops_casino
      dockerfile: Dockerfile 
    image: casino-frontend:local 
    restart: unless-stopped 
    environment: 
      BACKEND_UPSTREAM: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
    networks:
      - casino-net

volumes:
  pg_data:

networks:
  casino-net:
    driver: bridge